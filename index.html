<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>English Start Journey</title>
<style>
:root{--b:#1e6fff;--bd:#0b3fa8;--y:#ffc400;--g:#1fae6e;--t:#14213d;--c:#fffffff0;--s:#e3ecff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--t:#eef3ff;--c:#14223fed;--s:#223763;--bd:#a9c4ff}}
:root[data-theme="dark"]{--t:#eef3ff;--c:#14223fed;--s:#223763;--bd:#a9c4ff}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;color:var(--t);background:linear-gradient(160deg,#0b3fa8,#0a8f7a);display:flex;justify-content:center}
#bg{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:430px;transform:translateX(-50%);filter:saturate(1.1)}#bg svg{width:100%;height:100%;display:block}
#app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow:auto;padding:12px}
nav{display:flex;background:var(--c)}nav button{flex:1;border:0;background:none;padding:7px 0;font:600 11px inherit;color:var(--t);opacity:.65}nav button.on{opacity:1;color:var(--b)}nav b{display:block;font-size:22px}
.loc{display:inline-block;background:var(--c);border-radius:99px;padding:3px 12px;font-size:13px;margin-bottom:8px}
.card{background:var(--c);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 3px 12px #0003}
.btn,.btn2,.chip{border:0;border-radius:14px;font:inherit;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}
.btn{background:var(--b);color:#fff;padding:11px 16px}.btn2{background:var(--s);color:var(--bd);padding:11px 16px}.btn:disabled{opacity:.4}
.big{width:100%;font-size:20px;padding:16px;margin-bottom:10px;background:linear-gradient(90deg,#1e6fff,#18b4a6)}
.chip{background:var(--s);color:var(--bd);padding:6px 12px;border-radius:99px;margin:3px 3px 0 0;font-size:14px}.chip.on{background:var(--b);color:#fff}.chip:disabled{opacity:.45}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:12px;border-radius:12px;border:2px solid #b9c9ee;background:var(--c);color:var(--t);font:inherit;cursor:pointer}
.opt.ok{background:#c9f3dd;border-color:var(--g);color:#0b3d27}.opt.no{background:#ffd9d9;border-color:#e55;color:#5a1010}.opt.sel{background:#dbe8ff;border-color:var(--b);color:#0b2a66}
.w{display:inline-block;width:auto;margin:3px}
.bar{height:9px;border-radius:9px;background:#c5d2ee;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--g)}
.stats{display:flex;gap:8px;margin-top:8px;text-align:center}.stats div{flex:1;font-size:22px}.stats small{font-size:12px}
.two{display:flex;gap:8px}.two>div{flex:1}
.grid,.grid5{display:grid;gap:6px;grid-template-columns:repeat(4,1fr)}.grid5{grid-template-columns:repeat(5,1fr)}.grid .opt,.grid5 .opt{text-align:center;padding:10px 2px;margin:0}
.txt{font-size:18px;line-height:1.5;margin:8px 0}
.fb{padding:9px;border-radius:10px;margin:8px 0}.fb.g{background:#c9f3dd;color:#0b3d27}.fb.r{background:#fff0c2;color:#4d3a00}
.trk{position:relative;height:44px;border-bottom:3px dashed #8aa;text-align:right}.trk span{position:absolute;left:0;font-size:32px;transition:left .5s}
input[type=text],input[type=search],input:not([type]){width:100%;padding:11px;border-radius:12px;border:2px solid #b9c9ee;font:inherit;margin:6px 0}
input[type=number]{width:70px;padding:6px;border-radius:8px;border:2px solid #b9c9ee}
.ipa{font-family:"Lucida Sans Unicode","Segoe UI",monospace;color:var(--b);font-weight:700}li{margin-left:18px}small{opacity:.8}
</style></head><body><div id="bg"></div><div id="app"><main id="m"></main><nav id="nv"></nav></div>

function items(k,n){const b=bank()[k];let f=S.tp?b.filter(x=>x.tp==S.tp):[];f=f.concat(shuf(b.filter(x=>!f.includes(x)))).slice(0,n);return f}
function run(list,end,hdr){let i=0,res=[];const nx=()=>{if(i>=list.length)return end(res);const{k,it}=list[i];Q={it,k,done:0,cb:ok=>{res.push({k,it,ok});i++;nx()}};show(k,it,i+1,list.length,hdr)};nx()}

function play(id){m.innerHTML=`<button class="btn2" onclick="games()">← Juegos</button><div id="gm"></div>`;({worm:()=>race("🐛","Worm Race"),kart:()=>race("🏎️","Kart Race"),ws:wsg,mem:mem})[id]()}
function race(e,n){const q=shuf(V()).slice(0,5);let i=0,c=0;window.rA=ok=>{if(ok)c++;i++;d()};const d=()=>{if(i>=5){S.pts+=c*5;save();$("#gm").innerHTML=`<div class="card"><h3>🏁 ¡Meta!</h3><p>${c}/5 correctas · +${c*5} puntos</p><button class="btn" onclick="play('${e=="🐛"?"worm":"kart"}')">Jugar otra vez</button></div>`;return}
const x=q[i],o=shuf([x[1],...shuf(V().filter(y=>y!=x)).slice(0,2).map(y=>y[1])]);$("#gm").innerHTML=`<div class="card"><h3>${e} ${n}</h3><div class="trk"><span style="left:${c*17}%">${e}</span>🏁</div><p>¿Qué significa <b>${x[0]}</b> <span class="ipa">${ip(x[0])}</span>?</p>${o.map(t=>`<button class="opt" onclick="rA(${t==x[1]})">${t}</button>`).join("")}</div>`};d()}
function mem(){let c=[];shuf(V()).slice(0,4).forEach((x,i)=>c.push({t:x[0],i},{t:x[1],i}));c=shuf(c);let o=[],f=0,mv=0;const d=()=>{$("#gm").innerHTML=`<div class="card"><h3>🃏 Memory Cards</h3><div class="grid">${c.map((x,j)=>`<button class="opt ${x.f?"ok":""}" style="font-size:13px" onclick="mf(${j})">${x.f||o.includes(j)?x.t:"❓"}</button>`).join("")}</div><p>Movimientos: ${mv}</p>${f==4?"<b>🎉 ¡Completado! +20 puntos</b>":""}</div>`};
window.mf=j=>{if(c[j].f||o.includes(j)||o.length>1)return;o.push(j);d();if(o.length==2){mv++;const[a,b]=o;if(c[a].i==c[b].i){c[a].f=c[b].f=1;f++;o=[];if(f==4){S.pts+=20;save()}d()}else setTimeout(()=>{o=[];d()},800)}};d()}
function wsg(){const g=["CATXZ","DOGQW","MILKP","BOOKR","SUNYE"],W=["CAT","DOG","MILK","BOOK","SUN"];let s=[],f=[],fc=[];const d=()=>{$("#gm").innerHTML=`<div class="card"><h3>🔎 Word Search</h3><p>Toca las letras en orden: ${W.map(w=>f.includes(w)?"<s>"+w+"</s>":w).join(" · ")}</p><div class="grid5">${g.join("").split("").map((ch,n)=>`<button class="opt ${fc.includes(n)?"ok":s.includes(n)?"sel":""}" onclick="wt(${n})">${ch}</button>`).join("")}</div><button class="btn2" onclick="ws0()">Borrar selección</button>${f.length==5?"<p><b>🎉 ¡Completado! +25 puntos</b></p>":""}</div>`};
window.ws0=()=>{s=[];d()};window.wt=n=>{if(!s.includes(n)&&!fc.includes(n))s.push(n);const t=s.map(x=>g[x/5|0][x%5]).join("");if(W.includes(t)&&!f.includes(t)){f.push(t);fc.push(...s);s=[];if(f.length==5){S.pts+=25;save()}}d()};d()}
/* ---------- EVALUACIÓN ---------- */
function evalv(){m.innerHTML=`<div class="card"><h3>🏆 Final Level Challenge</h3><p>Nivel <b>${S.lv}</b>. Evalúa juntas Listening, Speaking, Reading y Writing: 25 puntos cada una, 100 en total.</p><p><small>Para aprobar: ${S.cfg.min}/100 en total y mínimo ${S.cfg.sk}/100 en cada habilidad.</small></p><button class="btn" onclick="startEv()">Comenzar desafío</button></div>`+gl()+(S.ev?evRes(S.ev):"")}
function startEv(){const ks=["L","S","R","W"],ss={};ks.forEach(k=>ss[k]=shuf(bank()[k]).slice(0,3));run([0,1,2].flatMap(j=>ks.map(k=>({k,it:ss[k][j]}))),endEv,"Final Challenge")}
function endEv(res){const sc={},er=[];ORD.forEach(k=>{const r=res.filter(x=>x.k==k);sc[k]=+(r.filter(x=>x.ok).length/r.length*25).toFixed(1);r.filter(x=>!x.ok).forEach(x=>er.push({q:x.it.q||x.it.say,a:ans(x.it)}))});
const tot=+ORD.reduce((a,k)=>a+sc[k],0).toFixed(1),weak=ORD.filter(k=>sc[k]<S.cfg.sk/100*25),ok=tot>=S.cfg.min&&!weak.length,old=S.lv;
S.ev={lv:old,sc,tot,ok,er,weak};S.eh.push({lv:old,tot,sc});S.eh=S.eh.slice(-20);S.hist.unshift({d:today(),t:"Final Challenge "+old,s:tot+"/100"});tick();
if(ok&&LV.indexOf(old)==S.max&&S.max<5){S.max++;S.lv=LV[S.max];S.stars+=3;S.earned+=3;S.pts+=50}save();m.innerHTML=evRes(S.ev)+`<button class="btn2" onclick="go(3)">Volver</button>`}
function evRes(e){return`<div class="card"><h3>${e.ok?"🎉 ¡Aprobado!":"💪 Aún no aprobado"} ${e.tot}/100 <small>(${e.lv})</small></h3>${ORD.map(k=>`<div>${SK[k][1]} ${SK[k][0]}: <b>${e.sc[k]}/25</b><div class="bar"><i style="width:${e.sc[k]*4}%"></i></div></div>`).join("")}<p>${e.ok?"Has desbloqueado el siguiente nivel (+3 ⭐, +50 puntos).":"Necesitas "+S.cfg.min+" en total y "+S.cfg.sk+"/100 por habilidad."}</p>${e.weak.length?`<p>📌 Refuerza: <b>${e.weak.map(k=>SK[k][0]).join(", ")}</b>. Practica esas habilidades y repite el desafío.</p><button class="btn" onclick="go(1);start('${e.weak[0]}')">Practicar ${SK[e.weak[0]][0]}</button>`:""}${e.er.length?`<p><b>Errores:</b></p><ul>${e.er.map(x=>`<li>${x.q} → <b>${x.a}</b></li>`).join("")}</ul>`:""}</div>`}
/* ---------- PERFIL ---------- */
function prof0(){const h=S.eh,avg=h.length?(h.reduce((a,b)=>a+b.tot,0)/h.length).toFixed(1):"—",
ws=ORD.map(k=>{const x=KK(k);return[k,x.t?x.o/x.t:null]}).filter(x=>x[1]!==null).sort((a,b)=>a[1]-b[1])[0],
md=[[S.best>=3,"🔥 Racha de 3 días"],[S.pts>=100,"💯 100 puntos"],[S.max>0,"🏅 Nivel superado"],[S.un.length>0,"🎮 Primer juego desbloqueado"]].filter(x=>x[0]).map(x=>x[1]);
m.innerHTML=`<div class="card"><div class="two" style="align-items:center"><div style="flex:0 0 64px"><button class="chip" style="font-size:38px" onclick="S.av=(S.av+1)%12;save();view()">${AV[S.av]}</button></div><div><input value="${S.name}" maxlength="20" oninput="S.name=this.value||'Estudiante';save()" aria-label="Nombre"><small>Nivel ${S.lv} · completados: ${LV.slice(0,S.max).join(", ")||"ninguno"}</small></div></div></div>
<div class="card"><b>📊 Progreso</b><p>Promedio de evaluaciones: <b>${avg}</b> · Racha: <b>${S.streak}</b> (récord ${S.best})</p><p>${ORD.map(k=>`${SK[k][1]} ${Object.values(S.sk).reduce((a,l)=>a+((l[k]||{}).p||0),0)} pts`).join(" · ")}</p><p>⭐ Ganadas ${S.earned} · gastadas ${S.spent} · disponibles ${S.stars}</p><p>🎮 Juegos: ${S.un.map(i=>GM.find(g=>g[0]==i)[2]).join(", ")||"ninguno aún"}</p><p>🏅 ${md.join(" · ")||"Aún sin medallas"}</p><p>💡 ${ws?"Te conviene reforzar "+SK[ws[0]][0]+" ("+Math.round(ws[1]*100)+"% de aciertos).":"Empieza con tu primera actividad."}</p></div>
<div class="card"><b>🕘 Historial</b>${S.hist.slice(0,8).map(x=>`<br><small>${x.d} · ${x.t} · ${x.s}</small>`).join("")||"<br><small>Sin actividad todavía.</small>"}</div>
<div class="card"><b>⚙️ Configuración</b><br><label><input type="checkbox" ${S.snd?"checked":""} onchange="S.snd=this.checked;save()"> Sonido y voz</label><br><label><input type="checkbox" ${S.en?"checked":""} onchange="S.en=this.checked;save()"> Instrucciones en inglés</label><br><label><input type="checkbox" ${S.nt?"checked":""} onchange="S.nt=this.checked;save()"> Recordatorios diarios</label><br><label>Nota mínima total <input type="number" value="${S.cfg.min}" onchange="S.cfg.min=+this.value;save()"></label><br><label>Mínimo por habilidad <input type="number" value="${S.cfg.sk}" onchange="S.cfg.sk=+this.value;save()"></label><br><small>Privacidad: tus datos solo se guardan en este dispositivo.</small><br><button class="btn2" onclick="if(this.dataset.s){try{localStorage.removeItem(ky())}catch(e){}location.reload()}else{this.dataset.s=1;this.textContent='¿Seguro? Toca de nuevo'}">Borrar mis datos</button></div>`}
if(!R.length)T=5;view();
</script></body></html>
